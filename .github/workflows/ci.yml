name: ValenQuest CI & Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-verify:
    name: Rust & WebAssembly Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Version Homologation (SSOT: package.json)
        run: npm run version:check

      - name: Smoke Test Campaign Wiring (JS ↔ FSM contract)
        run: npm run test:campaign

      - name: Smoke Test Content Catalogs (JSON SSOT + reading wiring)
        run: npm run test:content

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Cargo Unit & Integration Tests
        run: cargo test --verbose

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Verify WebAssembly Compilation
        run: wasm-pack build --target web --out-dir www/pkg --release
