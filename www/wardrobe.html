  <div class="wardrobe-app">
    
    <!-- Barra Superior de Navegación del Ropero -->
    <header class="wardrobe-top-nav" role="banner">
      <a href="index.html" class="back-to-quest-btn" id="btn-back-to-quest" aria-label="Volver al juego principal">
        <svg class="vq-icon vq-icon--sm" aria-hidden="true"><use href="#vq-icon-unicorn"></use></svg>
        <span>← Volver a ValenQuest</span>
      </a>

      <div class="wardrobe-brand-badge">
        <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-wardrobe"></use></svg>
        <span>Ropero Mágico</span>
      </div>

      <div class="wardrobe-top-actions">
        <!-- Indicador de Saldo de Estrellas -->
        <div class="wardrobe-stars-pill" title="Tus estrellas acumuladas en Lumiria">
          <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-star"></use></svg>
          <strong id="wardrobe-star-balance">0</strong>
        </div>

        <!-- Efectos de Audio Web Audio API -->
        <button id="btn-toggle-mute" class="icon-btn" aria-label="Alternar sonido" title="Silenciar efectos">
          <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-sound-on"></use></svg>
        </button>

        <!-- Modo Noche / Día -->
        <button id="btn-toggle-theme" class="icon-btn" aria-label="Cambiar tema día/noche" title="Modo Noche Astral">
          <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-moon"></use></svg>
        </button>
      </div>
    </header>

    <!-- Layout Principal del Ropero -->
    <main class="wardrobe-main-layout" role="main">
      
      <!-- Columna Izquierda: Escenario / Pasarela (Listo para Three.js & Preview 2D) -->
      <section class="wardrobe-stage-column" aria-label="Probador de la heroína">
        
        <!-- Pestañas de Selección de Heroína -->
        <div class="wardrobe-heroine-tabs" role="tablist" aria-label="Elegir heroína para vestir">
          <button id="tab-wardrobe-valen" class="wardrobe-tab-btn active" role="tab" aria-selected="true" type="button">
            <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-crown"></use></svg> <span>Valen</span>
          </button>
          <button id="tab-wardrobe-reni" class="wardrobe-tab-btn" role="tab" aria-selected="false" type="button">
            <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-wing"></use></svg> <span>Reni</span>
          </button>
          <button id="tab-wardrobe-zoe" class="wardrobe-tab-btn" role="tab" aria-selected="false" type="button">
            <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-leaf"></use></svg> <span>Zoe</span>
          </button>
          <button id="tab-wardrobe-lia" class="wardrobe-tab-btn" role="tab" aria-selected="false" type="button">
            <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-crystal"></use></svg> <span>Lía</span>
          </button>
        </div>

        <!-- Escenario de la Pasarela -->
        <div class="wardrobe-stage-card">
          <div class="wardrobe-stage-environment" id="wardrobe-stage-environment">
            
            <!-- Contenedor WebGL para Three.js (Montaje dinámico de escenas 3D) -->
            <div id="threejs-stage-container" class="threejs-stage-container" aria-hidden="true"></div>

            <!-- Avatar 2D SVG Interactivo (Capa Actual y Fallback) -->
            <div id="wardrobe-preview-avatar" class="wardrobe-avatar-box">
              <svg class="wardrobe-preview-svg" viewBox="0 0 100 100" aria-hidden="true">
                <use id="wardrobe-svg-use" href="#vq-heroine-valen"></use>
              </svg>
            </div>
            
            <!-- Resplandor astral -->
            <div class="stage-astral-glow" aria-hidden="true"></div>
          </div>

          <!-- Información de la Heroína Seleccionada -->
          <div class="stage-info-bar">
            <div id="wardrobe-preview-title" class="wardrobe-preview-title">Valen • Guardiana del Prisma</div>
            <p id="wardrobe-preview-quote" class="wardrobe-preview-quote">«¡El Prisma Real refleja la luz de todos nuestros sueños!»</p>
            <button id="btn-speak-heroine" class="speak-hint-btn" type="button" aria-label="Escuchar voz de la heroína">
              <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-speech"></use></svg>
              <span id="heroine-speak-label">Escuchar a Valen</span>
            </button>
          </div>
        </div>

      </section>

      <!-- Columna Derecha: Catálogo y Boutique de Cosméticos -->
      <section class="wardrobe-catalog-column" aria-label="Catálogo de accesorios">
        
        <div class="catalog-header">
          <div class="catalog-title-group">
            <h2 class="catalog-title">
              <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-sparkles"></use></svg>
              <span>Accesorios y Joyas Astrales</span>
            </h2>
            <p class="catalog-subtitle">Desbloquea con tus estrellas o equipa los accesorios ganados en los Portales.</p>
          </div>

          <!-- Filtro por Categorías -->
          <div class="wardrobe-category-filters" role="tablist" aria-label="Filtrar por tipo de accesorio">
            <button class="category-chip active" data-category="all" type="button">Todos</button>
            <button class="category-chip" data-category="head" type="button">Coronas y Tiaras</button>
            <button class="category-chip" data-category="wings" type="button">Alas y Capas</button>
            <button class="category-chip" data-category="charm" type="button">Amuletos y Broches</button>
          </div>
        </div>

        <!-- Grid de Accesorios (Inyectado dinámicamente) -->
        <div id="wardrobe-items-grid" class="wardrobe-items-grid" aria-live="polite">
          <!-- Inyectado por wardrobe-page.js -->
        </div>

      </section>

    </main>

  </div>

  <!-- Controlador de la Página del Ropero -->
  <script type="module" src="js/wardrobe-page.js"></script>
</body>
