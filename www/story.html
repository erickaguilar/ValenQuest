<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>ValenQuest — El Gran Libro de las Princesas y el Reino de Lumiria</title>
  
  <!-- Prevención de FOUC de tema oscuro/claro -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem("vq-theme") || 
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute("data-theme", savedTheme);
      document.addEventListener('DOMContentLoaded', function() {
        if (document.body) document.body.setAttribute('data-theme', savedTheme);
      });
    })();
  </script>
  
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ValenQuest">

  <!-- Arquitectura Modular CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/theme-dark.css">
  <link rel="stylesheet" href="css/storybook.css">
  <script type="module" src="js/services/icons.js"></script>
</head>
<body>

  <!-- Biblioteca de Sprites SVG desacoplada: carga dinámica desde assets/icons.svg y assets/heroines.svg vía js/services/icons.js -->

  <div class="storybook-app">
    
    <!-- Barra Superior de Navegación del Lector -->
    <header class="storybook-top-nav" role="banner">
      <a href="index.html" class="back-to-quest-btn" aria-label="Volver a la pantalla principal">
        <svg class="vq-icon vq-icon--sm" aria-hidden="true"><use href="#vq-icon-unicorn"></use></svg>
        <span>← Volver a ValenQuest</span>
      </a>

      <div class="storybook-nav-actions">
        <!-- Música de Princesas (Cajita Musical Procedural) -->
        <button type="button" id="btn-toggle-music" class="back-to-quest-btn" aria-label="Música mágica de princesas">
          <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-sparkles"></use></svg>
          <span>Cajita Musical</span>
        </button>

        <!-- Narración en Voz Alta con Orión -->
        <button type="button" id="btn-read-aloud" class="back-to-quest-btn" aria-label="Escuchar relato con el Maestro Orión" title="Escuchar relato con el Maestro Orión">
          <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-owl"></use></svg>
          <span>Voz de Orión</span>
        </button>

        <!-- Selector Modo Noche / Día -->
        <button type="button" id="btn-toggle-theme" class="icon-btn" aria-label="Cambiar tema día/noche" title="Modo Noche Astral">
          <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-moon"></use></svg>
        </button>
      </div>
    </header>

    <!-- Marco Hardcover del Libro de Princesas -->
    <main class="fairytale-book" id="fairytale-book" role="main">
      <div class="book-outer-frame">
        
        <!-- Cintas Marcadoras de Capítulos (Bookmarks) -->
        <nav class="chapter-ribbons-bar" id="chapter-ribbons" aria-label="Capítulos de la historia"></nav>

        <!-- pliego del libro (Spread) -->
        <div class="book-spread">
          
          <!-- Página Izquierda: Espejo Mágico & Escenario Ilustrado -->
          <section class="page-stage" aria-label="Ilustración mágica del capítulo">
            <div class="magic-mirror-frame">
              <canvas id="mirror-canvas"></canvas>
              <div id="stage-character" class="stage-character-wrapper">
                <!-- SVG Inyectado dinámicamente -->
              </div>
            </div>

            <div id="stage-character-name" class="stage-character-badge">Lumiria</div>
            <div id="stage-character-sub" class="stage-character-sub">La Gran Alianza</div>

            <div class="stage-media-bar">
              <button type="button" id="btn-toggle-anim" class="stage-media-btn" title="Alternar animación del espejo mágico">
                <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-sparkles"></use></svg>
                <span>Animación Activa</span>
              </button>
            </div>
          </section>

          <!-- Página Derecha: Pergamino Manuscrito de Historia -->
          <article class="page-manuscript" aria-label="Texto del capítulo">
            <div>
              <header class="chapter-header">
                <span id="chapter-num" class="chapter-number">Capítulo I</span>
                <h1 id="chapter-title" class="chapter-title">El Reino de Lumiria y el Velo de la Duda</h1>
              </header>

              <div id="chapter-body" class="chapter-body">
                <!-- Texto inyectado dinámicamente -->
              </div>
            </div>

            <!-- Cita de Sabiduría de la Heroína -->
            <blockquote class="heroine-lore-quote">
              <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-crystal"></use></svg>
              <span id="chapter-quote">Cargando crónica...</span>
            </blockquote>

            <!-- Navegación Inferior de Páginas -->
            <footer class="book-bottom-nav">
              <button type="button" id="btn-prev-page" class="book-nav-btn" aria-label="Página anterior">
                <span>← Anterior</span>
              </button>

              <span id="page-indicator" class="page-indicator-pill">1 / 6</span>

              <button type="button" id="btn-next-page" class="book-nav-btn" aria-label="Página siguiente">
                <span>Siguiente →</span>
              </button>

              <!-- Botón CTA en el capítulo final -->
              <div id="cta-container" style="display: none; width: 100%; text-align: center; margin-top: 10px;">
                <a href="index.html" class="start-quest-cta-btn">
                  <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-sparkles"></use></svg>
                  <span>¡Comenzar mi Aventura en Lumiria!</span>
                </a>
              </div>
            </footer>
          </article>

        </div>

      </div>
    </main>

    <!-- Pie Informativo de Lectura -->
    <footer class="footer-bottom" style="text-align: center; margin-top: 8px;">
      <p style="font-size: 0.8rem; color: var(--vq-text-muted);">
        ValenQuest v1.0.0 • Las Crónicas de Lumiria © 2026 • Modo Cuento Infantil Offline
      </p>
    </footer>

  </div>

  <!-- Motor Interactivo del Storybook -->
  <script type="module" src="js/storybook.js"></script>
</body>
</html>
