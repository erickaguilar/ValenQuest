<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>ValenQuest | La Pluma de la Fluidez</title>

  <!-- Prevención de FOUC -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem("vq-theme");
      if (savedTheme) {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ValenQuest Lectura">

  <!-- Arquitectura Modular CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/theme-dark.css">
  <link rel="stylesheet" href="css/reading.css">
</head>
<body>

  <!-- SVG Sprite de Iconos y Heroínas (Local-first & Zero-CORS) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="vq-icon-unicorn" viewBox="0 0 64 64">
      <circle cx="32" cy="34" r="26" fill="#FFC8DD" opacity="0.35"/>
      <path d="M18,48 C18,48 18,36 24,30 C28,26 34,26 40,28 C46,30 50,36 50,44 C50,50 42,54 32,54 C24,54 18,48 18,48 Z" 
            fill="#FDF7FF" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
      <polygon points="34,6 29,22 39,22" fill="#FFD166" stroke="#4A3E56" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="38" cy="38" rx="3.5" ry="4.5" fill="#4A3E56"/>
      <circle cx="37" cy="36" r="1.5" fill="#FFFFFF"/>
    </symbol>

    <symbol id="vq-icon-crown" viewBox="0 0 64 64">
      <polygon points="12,46 16,24 26,34 32,18 38,34 48,24 52,46" fill="#FFD166" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="12" y="46" width="40" height="8" rx="3" fill="#FFAFCC" stroke="#4A3E56" stroke-width="3"/>
      <circle cx="32" cy="18" r="4" fill="#A2D2FF"/>
    </symbol>

    <!-- Ala Celestial de Reni (Pegaso - Brisa) -->
    <symbol id="vq-icon-wing" viewBox="0 0 64 64">
      <path d="M12,46 C6,34 10,20 22,12 C36,4 52,10 56,22 C60,34 50,44 42,48 C34,52 24,52 18,50 Z" 
            fill="#BDE0FE" stroke="#4A3E56" stroke-width="4" stroke-linejoin="round"/>
      <path d="M16,42 C12,32 16,22 26,16 C38,10 50,16 52,24 C54,34 46,42 38,44" 
            fill="#A2D2FF" stroke="#4A3E56" stroke-width="3" stroke-linejoin="round"/>
      <path d="M22,38 C20,30 26,22 34,18 C42,14 48,20 48,26 C46,34 38,38 30,40" 
            fill="#FFAFCC" stroke="#4A3E56" stroke-width="2.5"/>
      <circle cx="46" cy="22" r="2.5" fill="#FFD166"/>
      <path d="M28,20 C32,16 38,16 42,18" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- Hojas y Raíces de Zoe (Poni Terrestre - Escudo) -->
    <symbol id="vq-icon-leaf" viewBox="0 0 64 64">
      <path d="M16,54 C20,44 26,36 34,28" stroke="#4A3E56" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M12,42 C8,28 18,16 34,16 C36,32 26,44 12,42 Z" 
            fill="#34D399" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M14,40 C18,30 24,24 32,20" stroke="#B8F2E6" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M30,32 C32,18 44,12 54,16 C52,32 38,38 30,32 Z" 
            fill="#B8F2E6" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
      <circle cx="36" cy="18" r="4" fill="#FFAFCC" stroke="#4A3E56" stroke-width="2"/>
      <circle cx="36" cy="18" r="1.5" fill="#FFD166"/>
    </symbol>

    <!-- Cristal Cósmico de Lía (Unicornio - Foco) -->
    <symbol id="vq-icon-crystal" viewBox="0 0 64 64">
      <polygon points="32,6 50,22 42,54 22,54 14,22" 
               fill="#9D4EDD" stroke="#4A3E56" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="32,6 42,22 32,54 22,22" fill="#CDB4DB" stroke="#4A3E56" stroke-width="2.5"/>
      <polygon points="32,6 22,22 14,22" fill="#7B2CBF" stroke="#4A3E56" stroke-width="2"/>
      <polygon points="32,6 42,22 50,22" fill="#E4C1F9" stroke="#4A3E56" stroke-width="2"/>
      <polygon points="22,22 32,54 22,54" fill="#5A189A"/>
      <polygon points="42,22 32,54 42,54" fill="#9D4EDD"/>
      <polygon points="32,10 34,16 38,17 34,19 32,24 30,19 26,17 30,16" fill="#FFFFFF"/>
    </symbol>

    <symbol id="vq-icon-star" viewBox="0 0 64 64">
      <polygon points="32,6 39,23 58,24 43,36 48,54 32,43 16,54 21,36 6,24 25,23" 
               fill="#FFD166" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
    </symbol>

    <symbol id="vq-icon-prism" viewBox="0 0 64 64">
      <polygon points="32,8 54,48 10,48" fill="#CDB4DB" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
      <polygon points="32,8 42,48 22,48" fill="#FFAFCC" opacity="0.6"/>
    </symbol>

    <symbol id="vq-icon-quill" viewBox="0 0 64 64">
      <path d="M48,10 C48,10 32,18 24,32 C18,42 16,52 16,52 C16,52 24,48 34,42 C44,36 50,22 48,10 Z" 
            fill="#BDE0FE" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
      <line x1="20" y1="48" x2="38" y2="24" stroke="#4A3E56" stroke-width="2.5"/>
    </symbol>

    <symbol id="vq-icon-sparkles" viewBox="0 0 64 64">
      <path d="M32,8 L36,24 L52,28 L36,32 L32,48 L28,32 L12,28 L28,24 Z" fill="#FFD166" stroke="#4A3E56" stroke-width="3" stroke-linejoin="round"/>
    </symbol>

    <symbol id="vq-icon-owl" viewBox="0 0 64 64">
      <ellipse cx="32" cy="36" rx="20" ry="22" fill="#BDE0FE" stroke="#4A3E56" stroke-width="3.5"/>
      <circle cx="24" cy="30" r="7" fill="#FDF7FF" stroke="#4A3E56" stroke-width="2.5"/>
      <circle cx="40" cy="30" r="7" fill="#FDF7FF" stroke="#4A3E56" stroke-width="2.5"/>
      <circle cx="25" cy="30" r="3" fill="#4A3E56"/>
      <circle cx="39" cy="30" r="3" fill="#4A3E56"/>
      <polygon points="32,36 28,42 36,42" fill="#FFD166" stroke="#4A3E56" stroke-width="2"/>
    </symbol>

    <symbol id="vq-icon-scroll" viewBox="0 0 64 64">
      <rect x="14" y="16" width="36" height="36" rx="4" fill="#FFF0C2" stroke="#4A3E56" stroke-width="3.5"/>
      <line x1="22" y1="26" x2="42" y2="26" stroke="#4A3E56" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="22" y1="34" x2="42" y2="34" stroke="#4A3E56" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>

    <symbol id="vq-icon-wardrobe" viewBox="0 0 64 64">
      <rect x="12" y="10" width="40" height="46" rx="4" fill="#FFC8DD" stroke="#4A3E56" stroke-width="3.5"/>
      <line x1="32" y1="10" x2="32" y2="56" stroke="#4A3E56" stroke-width="3"/>
      <circle cx="27" cy="32" r="2.5" fill="#4A3E56"/>
      <circle cx="37" cy="32" r="2.5" fill="#4A3E56"/>
    </symbol>

    <symbol id="vq-icon-moon" viewBox="0 0 64 64">
      <path d="M38,12 C24,14 14,26 16,40 C18,52 30,58 42,54 C32,50 28,38 32,28 C34,22 38,16 38,12 Z" 
            fill="#CDB4DB" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
    </symbol>

    <symbol id="vq-icon-sun" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="14" fill="#FFD166" stroke="#4A3E56" stroke-width="3.5"/>
      <line x1="32" y1="8" x2="32" y2="14" stroke="#4A3E56" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="32" y1="50" x2="32" y2="56" stroke="#4A3E56" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="8" y1="32" x2="14" y2="32" stroke="#4A3E56" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="50" y1="32" x2="56" y2="32" stroke="#4A3E56" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>

    <symbol id="vq-icon-sound-on" viewBox="0 0 64 64">
      <path d="M12,24 L22,24 L34,14 L34,50 L22,40 L12,40 Z" fill="#A2D2FF" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M42,22 C46,26 46,38 42,42" fill="none" stroke="#4A3E56" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>

    <symbol id="vq-icon-sound-off" viewBox="0 0 64 64">
      <path d="M12,24 L22,24 L34,14 L34,50 L22,40 L12,40 Z" fill="#FFC8DD" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
      <line x1="42" y1="24" x2="54" y2="40" stroke="#4A3E56" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>
  </svg>

  <div class="reading-app">
    
    <!-- Barra Superior de Navegación Cruzada -->
    <header class="reading-top-nav" role="banner">
      <a href="index.html" class="reading-brand-badge" title="Ir al Salón Principal de ValenQuest">
        <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-quill"></use></svg>
        <span>La Pluma de la Fluidez</span>
      </a>

      <div class="reading-top-actions">
        <!-- Saldo de Estrellas de Campaña -->
        <div class="reading-stars-pill" title="Tus estrellas de campaña en Lumiria">
          <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-star"></use></svg>
          <strong id="reading-star-balance">0</strong>
        </div>

        <!-- Saldo de Diamantes de Práctica -->
        <a href="wardrobe.html" class="reading-diamonds-pill" title="Tus diamantes ganados en práctica — ¡Toca para ir a la boutique!" style="text-decoration:none;">
          <span aria-hidden="true">💎</span>
          <strong id="reading-diamond-balance">0</strong>
        </a>

        <!-- Silenciar Sonido -->
        <button id="btn-toggle-mute" class="icon-btn" aria-label="Alternar sonido" title="Silenciar efectos">
          <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-sound-on"></use></svg>
        </button>

        <!-- Modo Noche / Día -->
        <button id="btn-toggle-theme" class="icon-btn" aria-label="Cambiar tema día/noche" title="Modo Noche Astral">
          <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-moon"></use></svg>
        </button>
      </div>
    </header>

    <!-- Barra Arcade de Lectura en Vivo (Nivel, Racha, Diamantes y Combo) -->
    <section class="reading-practice-bar" id="reading-practice-bar" aria-label="Controles del modo práctica de lectura">
      <div class="reading-bar-row">
        <div class="reading-bar-info">
          <span class="reading-title-tag">
            <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-quill"></use></svg>
            <strong id="reading-active-title">💧 Nivel 1: Ecos de Rocío (Palabras Directas)</strong>
          </span>
          <span class="reading-streak-tag" id="reading-streak-tag">
            🔥 Racha: <strong id="reading-streak-val">0</strong> • Récord: <span id="reading-record-val">0</span>
          </span>
          <span class="reading-diamonds-tag" id="reading-diamonds-tag" title="Diamantes ganados en práctica de lectura">
            💎 <strong id="reading-diamonds-val">0</strong>
          </span>
        </div>

        <div class="reading-chips-wrapper">
          <span class="reading-chips-label">Nivel:</span>
          <div class="level-chips-row" id="reading-level-chips" role="group" aria-label="Cambiar nivel de lectura en caliente">
            <button type="button" class="level-chip-btn active" data-level="1" title="Nivel 1: Ecos de Rocío (Palabras directas)">1</button>
            <button type="button" class="level-chip-btn" data-level="2" title="Nivel 2: Vientos Cruzados (Sílabas trabadas)">2</button>
            <button type="button" class="level-chip-btn" data-level="3" title="Nivel 3: Pergaminos Cantarines (Oraciones con Orión)">3</button>
            <button type="button" class="level-chip-btn" data-level="4" title="Nivel 4: Vuelo Rápido RSVP (Velocímetro visual)">4</button>
            <button type="button" class="level-chip-btn" data-level="5" title="Nivel 5: Fábulas del Grimorio (Comprensión lectora)">5</button>
          </div>
        </div>
      </div>

      <!-- Barra de Combo Lírico -->
      <div class="reading-combo-wrapper" id="reading-combo-wrapper" aria-label="Barra de Combo Lírico">
        <div class="reading-combo-header">
          <span class="reading-combo-title">
            <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-sparkles"></use></svg>
            <strong>Combo Lírico</strong>
            <span class="reading-combo-badge" id="reading-combo-badge">⚡ x1</span>
          </span>
          <span class="reading-combo-pct" id="reading-combo-pct">0%</span>
        </div>
        <div class="reading-combo-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div class="reading-combo-fill" id="reading-combo-fill" style="width: 0%"></div>
        </div>
      </div>
    </section>

    <!-- Tarjeta Principal del Desafío Lector Interactivo -->
    <main class="reading-challenge-layout" role="main">
      <article class="reading-challenge-card" id="reading-challenge-card" aria-live="polite">
        
        <!-- Cabecera de la Consigna -->
        <div class="challenge-prompt-row">
          <span class="challenge-prompt-text">
            <svg class="vq-icon vq-icon--sm" aria-hidden="true"><use href="#vq-icon-owl"></use></svg>
            <strong id="challenge-prompt-text">¿Qué palabra se forma al unir las sílabas?</strong>
          </span>

          <button type="button" id="btn-speak-challenge" class="btn-speak-orion" title="Escuchar pronunciación con el Maestro Orión">
            <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-sparkles"></use></svg>
            <span>Escuchar a Orión</span>
          </button>
        </div>

        <!-- Área Dinámica de Visualización Lingüística -->
        <div class="challenge-content-area" id="challenge-content-area">
          <div class="syllable-bubbles-row">
            <span class="syllable-bubble">lu</span>
            <span class="syllable-plus">+</span>
            <span class="syllable-bubble">na</span>
          </div>
        </div>

        <!-- Opciones Múltiples de Selección -->
        <div class="reading-options-grid" id="reading-options-grid" role="group" aria-label="Opciones de respuesta">
          <button type="button" class="reading-choice-btn">luna</button>
          <button type="button" class="reading-choice-btn">lana</button>
          <button type="button" class="reading-choice-btn">cuna</button>
          <button type="button" class="reading-choice-btn">lupa</button>
        </div>

        <!-- Barra de Poderes del Cuarteto de la Armonía (Prisma, Brisa, Escudo, Foco) -->
        <div class="companion-powers-bar reading-powers-bar" id="reading-powers-bar" aria-label="Poderes de amistad del Cuarteto de la Armonía">
          <span class="powers-bar-label">
            <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-sparkles"></use></svg>
            <span>Poderes de Lumiria:</span>
          </span>
          <div class="companion-powers-grid">
            <button id="btn-power-valen" class="power-btn" type="button" title="Valen (Alicornio): Prisma Real - Descarta una opción incorrecta">
              <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-crown"></use></svg>
              <span>Prisma</span>
              <span class="power-charge-badge" id="badge-valen">2</span>
            </button>
            <button id="btn-power-reni" class="power-btn" type="button" title="Reni (Pegaso): Brisa Temporal - Tiempo extra y calma">
              <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-wing"></use></svg>
              <span>Brisa</span>
              <span class="power-charge-badge" id="badge-reni">2</span>
            </button>
            <button id="btn-power-zoe" class="power-btn" type="button" title="Zoe (Poni Terrestre): Escudo de Raíces - Protege tu racha ante error">
              <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-leaf"></use></svg>
              <span>Escudo</span>
              <span class="power-charge-badge" id="badge-zoe">2</span>
            </button>
            <button id="btn-power-lia" class="power-btn" type="button" title="Lía (Unicornio): Foco de Cristal - Resalta la pista clave">
              <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-crystal"></use></svg>
              <span>Foco</span>
              <span class="power-charge-badge" id="badge-lia">2</span>
            </button>
          </div>
        </div>

      </article>
    </main>

    <!-- Pie de Navegación Cruzada Completa -->
    <footer class="reading-footer" role="navigation" aria-label="Navegación rápida de pie">
      <a href="index.html" class="reading-nav-link-btn" title="Ir al Salón Principal">
        <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-unicorn"></use></svg>
        <span>Salón Principal</span>
      </a>

      <a href="math.html" class="reading-nav-link-btn" title="Pasar al entrenamiento de cálculo mental">
        <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-prism"></use></svg>
        <span>El Prisma Numérico (💎)</span>
      </a>

      <a href="campaign.html" class="reading-nav-link-btn" title="Ir a la campaña La Gran Aventura">
        <span aria-hidden="true">🚀</span>
        <span>La Gran Aventura (⭐)</span>
      </a>

      <a href="wardrobe.html" class="reading-nav-link-btn" title="Ir al ropero y boutique mágica">
        <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-wardrobe"></use></svg>
        <span>Ropero Mágico (💎)</span>
      </a>
    </footer>

  </div>

  <!-- Controlador Interactivo de Lectura -->
  <script type="module" src="js/reading-page.js"></script>
</body>
</html>
