<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>ValenQuest | El Prisma Numérico</title>

  <!-- Prevención de FOUC -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem("vq-theme");
      if (savedTheme) {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ValenQuest Matemáticas">

  <!-- Arquitectura Modular CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/theme-dark.css">
  <link rel="stylesheet" href="css/math.css">
</head>
<body>

  <!-- SVG Sprite de Iconos y Heroínas (Local-first & Zero-CORS) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="vq-icon-unicorn" viewBox="0 0 64 64">
      <circle cx="32" cy="34" r="26" fill="#FFC8DD" opacity="0.35"/>
      <path d="M18,48 C18,48 18,36 24,30 C28,26 34,26 40,28 C46,30 50,36 50,44 C50,50 42,54 32,54 C24,54 18,48 18,48 Z" 
            fill="#FDF7FF" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
      <polygon points="34,6 29,22 39,22" fill="#FFD166" stroke="#4A3E56" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="38" cy="38" rx="3.5" ry="4.5" fill="#4A3E56"/>
      <circle cx="37" cy="36" r="1.5" fill="#FFFFFF"/>
    </symbol>

    <symbol id="vq-icon-crown" viewBox="0 0 64 64">
      <polygon points="12,46 16,24 26,34 32,18 38,34 48,24 52,46" fill="#FFD166" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="12" y="46" width="40" height="8" rx="3" fill="#FFAFCC" stroke="#4A3E56" stroke-width="3"/>
      <circle cx="32" cy="18" r="4" fill="#A2D2FF"/>
    </symbol>

    <symbol id="vq-icon-star" viewBox="0 0 64 64">
      <polygon points="32,6 39,23 58,24 43,36 48,54 32,43 16,54 21,36 6,24 25,23" 
               fill="#FFD166" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
    </symbol>

    <symbol id="vq-icon-prism" viewBox="0 0 64 64">
      <polygon points="32,8 54,48 10,48" fill="#CDB4DB" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
      <polygon points="32,8 42,48 22,48" fill="#FFAFCC" opacity="0.6"/>
    </symbol>

    <symbol id="vq-icon-quill" viewBox="0 0 64 64">
      <path d="M48,10 C48,10 32,18 24,32 C18,42 16,52 16,52 C16,52 24,48 34,42 C44,36 50,22 48,10 Z" 
            fill="#BDE0FE" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
      <line x1="20" y1="48" x2="38" y2="24" stroke="#4A3E56" stroke-width="2.5"/>
    </symbol>

    <symbol id="vq-icon-sparkles" viewBox="0 0 64 64">
      <path d="M32,8 L36,24 L52,28 L36,32 L32,48 L28,32 L12,28 L28,24 Z" fill="#FFD166" stroke="#4A3E56" stroke-width="3" stroke-linejoin="round"/>
    </symbol>

    <symbol id="vq-icon-owl" viewBox="0 0 64 64">
      <ellipse cx="32" cy="36" rx="20" ry="22" fill="#BDE0FE" stroke="#4A3E56" stroke-width="3.5"/>
      <circle cx="24" cy="30" r="7" fill="#FDF7FF" stroke="#4A3E56" stroke-width="2.5"/>
      <circle cx="40" cy="30" r="7" fill="#FDF7FF" stroke="#4A3E56" stroke-width="2.5"/>
      <circle cx="25" cy="30" r="3" fill="#4A3E56"/>
      <circle cx="39" cy="30" r="3" fill="#4A3E56"/>
      <polygon points="32,36 28,42 36,42" fill="#FFD166" stroke="#4A3E56" stroke-width="2"/>
    </symbol>

    <symbol id="vq-icon-wardrobe" viewBox="0 0 64 64">
      <rect x="12" y="10" width="40" height="46" rx="4" fill="#FFC8DD" stroke="#4A3E56" stroke-width="3.5"/>
      <line x1="32" y1="10" x2="32" y2="56" stroke="#4A3E56" stroke-width="3"/>
      <circle cx="27" cy="32" r="2.5" fill="#4A3E56"/>
      <circle cx="37" cy="32" r="2.5" fill="#4A3E56"/>
    </symbol>

    <symbol id="vq-icon-moon" viewBox="0 0 64 64">
      <path d="M38,12 C24,14 14,26 16,40 C18,52 30,58 42,54 C32,50 28,38 32,28 C34,22 38,16 38,12 Z" 
            fill="#CDB4DB" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
    </symbol>

    <symbol id="vq-icon-sun" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="14" fill="#FFD166" stroke="#4A3E56" stroke-width="3.5"/>
      <line x1="32" y1="8" x2="32" y2="14" stroke="#4A3E56" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="32" y1="50" x2="32" y2="56" stroke="#4A3E56" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="8" y1="32" x2="14" y2="32" stroke="#4A3E56" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="50" y1="32" x2="56" y2="32" stroke="#4A3E56" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>

    <symbol id="vq-icon-sound-on" viewBox="0 0 64 64">
      <path d="M12,24 L22,24 L34,14 L34,50 L22,40 L12,40 Z" fill="#A2D2FF" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M42,22 C46,26 46,38 42,42" fill="none" stroke="#4A3E56" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>

    <symbol id="vq-icon-sound-off" viewBox="0 0 64 64">
      <path d="M12,24 L22,24 L34,14 L34,50 L22,40 L12,40 Z" fill="#FFC8DD" stroke="#4A3E56" stroke-width="3.5" stroke-linejoin="round"/>
      <line x1="42" y1="24" x2="54" y2="40" stroke="#4A3E56" stroke-width="3.5" stroke-linecap="round"/>
    </symbol>
  </svg>

  <div class="math-app">
    
    <!-- Barra Superior de Navegación Cruzada -->
    <header class="math-top-nav" role="banner">
      <a href="index.html" class="math-brand-badge" title="Ir al Salón Principal de ValenQuest">
        <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-prism"></use></svg>
        <span>El Prisma Numérico</span>
      </a>

      <!-- Barra de Navegación Cruzada Rápida -->
      <nav class="cross-nav-bar" aria-label="Navegación entre reinos de Lumiria">
        <a href="index.html" class="cross-nav-link" title="Salón Principal">
          <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-unicorn"></use></svg>
          <span>Salón</span>
        </a>
        <a href="campaign.html" class="cross-nav-link" title="La Gran Aventura (Campaña)">
          <span aria-hidden="true">🚀</span>
          <span>Campaña</span>
        </a>
        <a href="math.html" class="cross-nav-link active" title="El Prisma Numérico (Cálculo)">
          <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-prism"></use></svg>
          <span>Cálculo</span>
        </a>
        <a href="reading.html" class="cross-nav-link" title="La Pluma de la Fluidez (Lectura)">
          <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-quill"></use></svg>
          <span>Lectura</span>
        </a>
        <a href="wardrobe.html" class="cross-nav-link" title="Ropero Mágico y Boutique">
          <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-wardrobe"></use></svg>
          <span>Ropero</span>
        </a>
      </nav>

      <div class="math-top-actions">
        <!-- Saldo de Estrellas de Campaña -->
        <div class="math-stars-pill" title="Tus estrellas de campaña en Lumiria">
          <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-star"></use></svg>
          <strong id="math-star-balance">0</strong>
        </div>

        <!-- Saldo de Diamantes de Práctica -->
        <a href="wardrobe.html" class="math-diamonds-pill" title="Tus diamantes ganados en práctica — ¡Toca para ir a la boutique!" style="text-decoration:none;">
          <span aria-hidden="true">💎</span>
          <strong id="math-diamond-balance">0</strong>
        </a>

        <!-- Silenciar Sonido -->
        <button id="btn-toggle-mute" class="icon-btn" aria-label="Alternar sonido" title="Silenciar efectos">
          <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-sound-on"></use></svg>
        </button>

        <!-- Modo Noche / Día -->
        <button id="btn-toggle-theme" class="icon-btn" aria-label="Cambiar tema día/noche" title="Modo Noche Astral">
          <svg class="vq-icon" aria-hidden="true"><use href="#vq-icon-moon"></use></svg>
        </button>
      </div>
    </header>

    <!-- Barra Arcade de Matemáticas en Vivo (Nivel, Racha, Diamantes y Combo) -->
    <section class="math-practice-bar" id="math-practice-bar" aria-label="Controles del modo práctica de cálculo">
      <div class="math-bar-row">
        <div class="math-bar-info">
          <span class="math-title-tag">
            <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-prism"></use></svg>
            <strong id="math-active-title">✨ Nivel 1: Chispas Estelares (Conteo y Sumas 1..10)</strong>
          </span>
          <span class="math-streak-tag" id="math-streak-tag">
            🔥 Racha: <strong id="math-streak-val">0</strong> • Récord: <span id="math-record-val">0</span>
          </span>
          <span class="math-diamonds-tag" id="math-diamonds-tag" title="Diamantes ganados en cálculo mental">
            💎 <strong id="math-diamonds-val">0</strong>
          </span>
        </div>

        <div class="math-chips-wrapper">
          <span class="math-chips-label">Nivel:</span>
          <div class="level-chips-row" id="math-level-chips" role="group" aria-label="Cambiar nivel de cálculo en caliente">
            <button type="button" class="level-chip-btn active" data-level="1" title="Nivel 1: Chispas Estelares (Conteo y Sumas 1..10)">1</button>
            <button type="button" class="level-chip-btn" data-level="2" title="Nivel 2: Senderos de Nubes (Sumas y Restas hasta 20)">2</button>
            <button type="button" class="level-chip-btn" data-level="3" title="Nivel 3: Enigmas de Cristal (Acarreo y Desagrupación)">3</button>
            <button type="button" class="level-chip-btn" data-level="4" title="Nivel 4: El Salón de los Reflejos (Tablas 2, 3, 5 y 10)">4</button>
            <button type="button" class="level-chip-btn" data-level="5" title="Nivel 5: Vórtice Cósmico (Tablas Avanzadas y Desafíos)">5</button>
          </div>
        </div>
      </div>

      <!-- Barra de Combo Astral -->
      <div class="math-combo-wrapper" id="math-combo-wrapper" aria-label="Barra de Combo Astral">
        <div class="math-combo-header">
          <span class="math-combo-title">
            <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-sparkles"></use></svg>
            <strong>Combo Astral</strong>
            <span class="math-combo-badge" id="math-combo-badge">⚡ x1</span>
          </span>
          <span class="math-combo-pct" id="math-combo-pct">0%</span>
        </div>
        <div class="math-combo-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div class="math-combo-fill" id="math-combo-fill" style="width: 0%"></div>
        </div>
      </div>
    </section>

    <!-- Tarjeta Principal del Desafío Matemático Interactivo (Homologada) -->
    <main class="math-challenge-layout" role="main">
      <article class="math-challenge-card" id="math-challenge-card" aria-live="polite">
        
        <!-- Cabecera de la Consigna -->
        <div class="challenge-prompt-row">
          <span class="challenge-prompt-text">
            <svg class="vq-icon vq-icon--sm" aria-hidden="true"><use href="#vq-icon-owl"></use></svg>
            <strong id="challenge-prompt-text">Calcula el resultado exacto:</strong>
          </span>

          <div class="challenge-prompt-actions">
            <button type="button" id="btn-speak-challenge" class="btn-speak-orion" title="Escuchar la operación con el Maestro Orión">
              <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-sparkles"></use></svg>
              <span>Escuchar</span>
            </button>

            <button type="button" id="btn-toggle-math-mode" class="btn-mode-toggle" title="Alternar entre teclado y opciones múltiples">
              <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-sparkles"></use></svg>
              <span>Usar Teclado 🔢</span>
            </button>
          </div>
        </div>

        <!-- Área de Visualización de la Operación de Cálculo -->
        <div class="math-expression-area" id="math-expression-area">
          <div class="math-expression-display" id="math-expression-display">
            <span class="math-op1" id="math-op1">0</span>
            <span class="math-operator" id="math-operator">+</span>
            <span class="math-op2" id="math-op2">0</span>
            <span class="math-equals">=</span>
            <span class="math-target-q" id="math-preview-val">?</span>
          </div>
        </div>

        <!-- Modo 1: Opciones Múltiples de Selección -->
        <div id="math-options-container" class="math-options-container">
          <div class="math-options-grid" id="math-options-grid" role="group" aria-label="Opciones de respuesta numérica">
            <!-- Botones inyectados dinámicamente -->
          </div>
        </div>

        <!-- Modo 2: Teclado Numérico Arcade -->
        <div id="math-keypad-container" class="math-keypad-container" hidden>
          <div class="math-keypad-grid" id="math-keypad-grid">
            <button type="button" class="math-keypad-btn" data-digit="1">1</button>
            <button type="button" class="math-keypad-btn" data-digit="2">2</button>
            <button type="button" class="math-keypad-btn" data-digit="3">3</button>
            <button type="button" class="math-keypad-btn" data-digit="4">4</button>
            <button type="button" class="math-keypad-btn" data-digit="5">5</button>
            <button type="button" class="math-keypad-btn" data-digit="6">6</button>
            <button type="button" class="math-keypad-btn" data-digit="7">7</button>
            <button type="button" class="math-keypad-btn" data-digit="8">8</button>
            <button type="button" class="math-keypad-btn" data-digit="9">9</button>
            <button type="button" class="math-keypad-btn keypad-clear" data-digit="backspace">⌫ Borrar</button>
            <button type="button" class="math-keypad-btn" data-digit="0">0</button>
            <button type="button" class="math-keypad-btn keypad-clear" data-digit="backspace">C</button>
          </div>
          <button type="button" class="math-keypad-submit" id="btn-keypad-submit">
            <span>Enviar Respuesta Mágica</span>
            <span aria-hidden="true">✨</span>
          </button>
        </div>

        <!-- Barra de Poderes de las Guardianas de la Armonía (Homologada) -->
        <div class="math-powers-bar" id="math-powers-bar" aria-label="Poderes de amistad de las princesas">
          <!-- Chips de poderes inyectados dinámicamente -->
        </div>

      </article>
    </main>

    <!-- Pie de Navegación Cruzada Completa -->
    <footer class="math-footer" role="navigation" aria-label="Navegación rápida de pie">
      <a href="index.html" class="math-nav-link-btn" title="Ir al Salón Principal">
        <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-unicorn"></use></svg>
        <span>Salón Principal</span>
      </a>

      <a href="reading.html" class="math-nav-link-btn" title="Pasar al entrenamiento de lectura">
        <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-quill"></use></svg>
        <span>La Pluma de la Fluidez (💎)</span>
      </a>

      <a href="campaign.html" class="math-nav-link-btn" title="Ir a la campaña La Gran Aventura">
        <span aria-hidden="true">🚀</span>
        <span>La Gran Aventura (⭐)</span>
      </a>

      <a href="wardrobe.html" class="math-nav-link-btn" title="Ir al ropero y boutique mágica">
        <svg class="vq-icon vq-icon--xs" aria-hidden="true"><use href="#vq-icon-wardrobe"></use></svg>
        <span>Ropero Mágico (💎)</span>
      </a>
    </footer>

  </div>

  <!-- Controlador Interactivo de Matemáticas -->
  <script type="module" src="js/math-page.js"></script>
</body>
</html>
